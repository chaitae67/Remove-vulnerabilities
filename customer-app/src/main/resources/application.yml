server:
  port: ${SERVER_PORT:8081}
  # AE-19/AU-20/SN-17: Tomcat RemoteIpValve가 신뢰 프록시부터 X-Forwarded-For를
  # 오른쪽에서 왼쪽으로 해석하게 한다. framework 방식처럼 공격자가 넣은 첫 번째 값을
  # 곧바로 remoteAddr로 채택하지 않는다. 운영 프록시는 반드시 전달 헤더를 덮어써야 한다.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  # EP-04/IL-05: 애플리케이션 서버 제품명을 응답 헤더에 추가하지 않는다.
  server-header: ""
  # EP-04/IL-05: 오류 응답에 스택트레이스/예외/상세 메시지를 노출하지 않는다.
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      # IS-16/CC-18/SN-17: 세션 쿠키를 HttpOnly·Secure·SameSite로 보호한다.
      cookie:
        http-only: true
        secure: true
        same-site: strict

spring:
  application:
    name: clinic-customer-app
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:clinic}
    password: ${ORACLE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  h2:
    console:
      enabled: false
  freemarker:
    suffix: .ftl
    settings:
      # CI-01: ?api 빌트인은 Java 객체 API 노출로 악용될 수 있어 비활성화한다.
      api_builtin_enabled: "false"
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  base-url: ${APP_BASE_URL:https://www.zerodayclinic.p-e.kr}
  security:
    require-https: ${REQUIRE_HTTPS:true}
  mail-from-name: ${MAIL_FROM_NAME:zeroday_clinic}
  # WEB-24: 업로드 저장 경로를 시스템/프로그램 영역과 분리된 전용 경로로 사용한다.
  #   - 기본값을 프로세스 작업 디렉터리 기준 상대경로("uploads", → JDK bin/파일시스템 루트로 해석되는 문제)에서
  #     사용자 홈 하위의 별도 데이터 경로로 변경했다.
  #   - 운영에서는 두 앱이 공유하는 전용 경로를 APP_UPLOAD_DIR 로 지정하고, 해당 경로에는
  #     서비스 계정만 접근 가능하도록 권한을 제한한다(디렉터리 권한은 기동 시 소유자 전용으로 설정).
  upload-dir: ${APP_UPLOAD_DIR:${user.home}/zeroday-clinic/uploads}
  chatbot:
    ai:
      enabled: ${OLLAMA_ENABLED:false}
      model: ${OLLAMA_MODEL:gemma3:1b}
      endpoint: ${OLLAMA_CHAT_URL:http://localhost:11434/api/chat}

---
# 로컬(HTTP) 개발 환경에서는 Secure 쿠키를 사용하지 않아야 세션이 유지된다.
server:
  servlet:
    session:
      cookie:
        secure: false
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./work/clinic-local;MODE=Oracle;DATABASE_TO_UPPER=false;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
app:
  security:
    require-https: false
