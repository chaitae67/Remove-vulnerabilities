<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${review == null ? '후기 작성' : '후기 수정'}">후기 작성</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="narrow-wide">
    <section class="panel">
        <p class="eyebrow">Review</p>
        <h1 th:text="${review == null ? '후기 작성' : '후기 수정'}">후기 작성</h1>
        <form class="stack-form" th:action="${review == null ? '/reviews' : '/reviews/' + review.id + '/edit'}" method="post" enctype="multipart/form-data">
            <input th:if="${review == null}" type="hidden" name="writerId" th:value="${currentUserId}">
            <input name="title" placeholder="제목" required th:value="${formTitle != null ? formTitle : (review != null ? review.title : '')}">
            <select name="procedureProductId">
                <option value="">시술 선택 안 함</option>
                <option th:each="product : ${products}"
                        th:value="${product.id}"
                        th:text="${product.name}"
                        th:selected="${formProcedureProductId != null ? formProcedureProductId == product.id : (review != null and review.procedureProduct != null and review.procedureProduct.id == product.id)}">시술명</option>
            </select>
            <select name="rating" required>
                <option value="">평점 선택</option>
                <option th:each="score : ${#numbers.sequence(5, 1)}"
                        th:value="${score}"
                        th:text="${'★'.repeat(score)}"
                        th:selected="${formRating != null ? formRating == score : (review != null and review.rating == score)}">★★★★★</option>
            </select>
            <textarea name="content" rows="10" placeholder="시술 경험을 자세히 남겨주세요" required th:text="${formContent != null ? formContent : (review != null ? review.content : '')}"></textarea>
            <label class="check">사진 첨부 (이미지 파일만 업로드 가능)</label>
            <input name="photos" type="file" accept="image/*" multiple>
            <div th:if="${review != null and !review.attachments.isEmpty()}" class="attachments">
                <span th:each="file : ${review.attachments}" th:text="${file.originalFilename}">첨부파일</span>
            </div>
            <div class="form-actions">
                <button class="button secondary" type="submit" th:if="${review == null}" th:formaction="@{/reviews/preview}" formenctype="application/x-www-form-urlencoded">카드 미리보기</button>
                <button class="button" type="submit">저장</button>
            </div>
        </form>
    </section>
    <section class="panel" th:if="${preview != null or previewError != null}">
        <p class="eyebrow">Review Card Preview</p>
        <article class="review-preview-card">
            <div class="review-preview-head">
                <h2 th:text="${formTitle}">후기 제목</h2>
                <span class="state" th:text="${'★'.repeat(formRating)}">★★★★★</span>
            </div>
            <div class="flash danger" th:if="${previewError}" th:text="${previewError}">미리보기 오류</div>
            <div class="user-content-preview" th:if="${preview}" th:utext="${preview}">후기 내용</div>
        </article>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
