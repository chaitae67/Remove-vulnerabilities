<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지 작성</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="narrow-wide">
    <section class="panel">
        <p class="eyebrow">Admin Notice</p>
        <h1 th:text="${notice == null ? '공지 작성' : '공지 수정'}">공지 작성</h1>
        <form class="stack-form" th:action="${notice == null ? '/notices' : '/notices/' + notice.id + '/edit'}" method="post">
            <input name="title" placeholder="제목" required th:value="${notice != null ? notice.title : ''}">
            <textarea name="content" rows="12" placeholder="내용" required th:text="${notice != null ? notice.content : ''}"></textarea>
            <button class="button" type="submit">저장</button>
        </form>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
