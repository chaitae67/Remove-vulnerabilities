<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
    <section class="page-title with-action">
        <div>
            <p class="eyebrow">Notice</p>
            <h1>공지사항</h1>
        </div>
        <a sec:authorize="hasRole('ADMIN')" class="button" th:href="@{/notices/new}">공지 작성</a>
    </section>
    <div class="flash success" th:if="${message}" th:text="${message}"></div>
    <section class="content-band">
        <form th:action="@{/notices/search}" method="get" class="search-form">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="제목으로 검색">
            <button type="submit" class="button">검색</button>
        </form>
        <ul class="table-list">
            <li th:each="notice : ${notices}">
                <a th:href="@{/notices/{id}(id=${notice.id})}" th:text="${notice.title}">공지 제목</a>
                <span th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}">날짜</span>
            </li>
            <li th:if="${notices.isEmpty()}">
                <span>검색 결과가 없습니다.</span>
            </li>
        </ul>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
