<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온라인 상담</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
    <section class="page-title with-action">
        <div>
            <p class="eyebrow">Q&A</p>
            <h1>온라인 상담</h1>
            <p>로그인 후 사진 또는 문서를 첨부해 상담 글을 남길 수 있습니다.</p>
        </div>
        <a class="button" th:href="@{/qna/new}">상담 작성</a>
    </section>
    <div class="flash success" th:if="${message}" th:text="${message}"></div>
    <section class="content-band">
        <ul class="table-list">
            <li th:each="post : ${posts}">
                <a th:href="@{/qna/{id}(id=${post.id})}" th:text="${post.privatePost ? '비공개 상담글입니다' : post.title}">상담 제목</a>
                <span th:text="${post.answered ? '답변완료' : '대기'}">대기</span>
                <time th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">날짜</time>
            </li>
        </ul>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
