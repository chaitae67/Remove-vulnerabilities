<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 - 제로데이클리닉</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="event-page">
    <section class="event-hero"><p class="eyebrow">Zero Day Event</p><h1>지금 만나는<br>제로데이 혜택.</h1><p>상담과 예약에 필요한 현재 프로그램을 한곳에서 확인하세요.</p></section>
    <section class="event-grid-wrap">
        <article class="event-card event-welcome"><span>MEMBER BENEFIT</span><h2>신규 회원<br>웰컴 혜택</h2><p>가입 후 사용할 수 있는 웰컴 쿠폰을 확인해 보세요.</p><strong>WELCOME10000</strong><a th:href="@{/register}">회원가입하기 →</a></article>
        <article class="event-card" th:each="procedure : ${procedures}"><span th:text="${procedure.category}">PROGRAM</span><h2 th:text="${procedure.name}">프로그램명</h2><p th:text="${procedure.summary}">프로그램 설명</p><strong th:text="|${#numbers.formatInteger(procedure.price, 0, 'COMMA')}원|">0원</strong><a th:href="@{/payments/checkout/{id}(id=${procedure.id})}">예약 자세히 보기 →</a></article>
    </section>
    <section class="event-notice"><strong>안내사항</strong><p>이벤트 및 패키지의 적용 여부와 최종 비용은 개인 상태와 의료진 상담에 따라 달라질 수 있습니다.</p></section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
