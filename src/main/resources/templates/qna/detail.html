<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title}">상담 상세</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="narrow-wide">
    <div class="flash success" th:if="${message}" th:text="${message}"></div>
    <article class="panel article">
        <p class="eyebrow">Online Q&A</p>
        <h1 th:text="${post.privatePost && !canReadPrivate ? '비공개 상담글입니다' : post.title}">상담 제목</h1>
        <p class="muted" th:text="|${post.writer.name} · ${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}|">작성정보</p>

        <div th:if="${canReadPrivate}">
            <div class="article-body" th:text="${post.content}">본문</div>
            <div class="attachments" th:if="${!post.attachments.isEmpty()}">
                <h2>첨부파일</h2>
                <a th:each="file : ${post.attachments}" th:href="@{/uploads/qna/{name}(name=${file.storedFilename})}" th:text="${file.originalFilename}" target="_blank">파일</a>
            </div>
            <section class="answer-box" th:if="${post.answered}">
                <span class="tag">답변완료</span>
                <p th:text="${post.answer}">답변</p>
            </section>
            <section class="answer-box muted-box" th:unless="${post.answered}">
                <span class="tag">대기</span>
                <p>관리자 답변을 기다리고 있습니다.</p>
            </section>
        </div>

        <div class="article-body" th:unless="${canReadPrivate}">
            작성자와 관리자만 볼 수 있는 상담 내용입니다.
        </div>

        <form class="stack-form answer-form" th:if="${canAnswer}" th:action="@{/qna/{id}/answer(id=${post.id})}" method="post">
            <textarea name="answer" rows="6" placeholder="관리자 답변" required th:text="${post.answer}"></textarea>
            <button class="button" type="submit">답변 저장</button>
        </form>

        <div class="actions">
            <a class="button button-outline" th:href="@{/qna}">목록</a>
        </div>
    </article>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
