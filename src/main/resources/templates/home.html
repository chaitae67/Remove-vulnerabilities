<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탑라인 성형외과</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <section class="hero">
        <div class="hero-copy">
            <p class="eyebrow">1:1 맞춤 상담 · 안전 중심 진료</p>
            <h1>탑라인 성형외과</h1>
            <p>바디라인, 얼굴 윤곽, 수술 후 케어까지 상담부터 예약 결제, Q&A까지 한 곳에서 관리하는 병원 홈페이지 샘플입니다.</p>
            <div class="hero-actions">
                <a class="button" th:href="@{/procedures}">패키지 보기</a>
                <a class="button button-light" th:href="@{/qna/new}">온라인 상담</a>
            </div>
        </div>
    </section>

    <div class="flash success" th:if="${message}" th:text="${message}"></div>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>

    <section class="content-band split">
        <div>
            <p class="eyebrow">Procedure Packages</p>
            <h2>상담 예약 결제</h2>
            <div class="product-grid">
                <article class="card product-card" th:each="procedure : ${procedures}">
                    <span class="tag" th:text="${procedure.category}"></span>
                    <h3 th:text="${procedure.name}">패키지명</h3>
                    <p th:text="${procedure.summary}">설명</p>
                    <strong th:text="|${#numbers.formatInteger(procedure.price, 0, 'COMMA')}원|">0원</strong>
                    <a class="button button-small" th:href="@{/payments/checkout/{id}(id=${procedure.id})}">예약 결제</a>
                </article>
            </div>
        </div>

        <aside class="quick-form">
            <p class="eyebrow">Quick Contact</p>
            <h2>빠른 비용 문의</h2>
            <form th:action="@{/consultations}" method="post">
                <input name="name" placeholder="성함" required>
                <input name="phone" placeholder="휴대전화번호" required>
                <select name="area" required>
                    <option value="">희망 부위</option>
                    <option>지방흡입</option>
                    <option>윤곽/리프팅</option>
                    <option>눈/코</option>
                    <option>사후관리</option>
                </select>
                <select name="preferredContact" required>
                    <option>전화 상담</option>
                    <option>문자 안내</option>
                    <option>카카오톡 안내</option>
                </select>
                <textarea name="message" placeholder="궁금한 내용을 남겨주세요"></textarea>
                <label class="check"><input type="checkbox" name="privacyAgreed" value="true" required> 개인정보 수집 및 이용 동의</label>
                <button class="button" type="submit">상담신청</button>
            </form>
        </aside>
    </section>

    <section class="content-band columns">
        <div>
            <div class="section-head">
                <h2>공지사항</h2>
                <a th:href="@{/notices}">more</a>
            </div>
            <form th:action="@{/notices/search}" method="get" class="search-form">
                <input type="text" name="keyword" placeholder="공지 제목 검색">
                <button type="submit" class="button button-small">검색</button>
            </form>
            <ul class="board-list">
                <li th:each="notice : ${notices}">
                    <a th:href="@{/notices/{id}(id=${notice.id})}" th:text="${notice.title}">공지</a>
                    <time th:text="${#temporals.format(notice.createdAt, 'MM-dd')}">08-22</time>
                </li>
            </ul>
        </div>
        <div>
            <div class="section-head">
                <h2>온라인 상담</h2>
                <a th:href="@{/qna}">more</a>
            </div>
            <ul class="board-list">
                <li th:each="post : ${qnas}">
                    <a th:href="@{/qna/{id}(id=${post.id})}" th:text="${post.privatePost ? '비공개 상담글입니다' : post.title}">상담</a>
                    <span class="state" th:text="${post.answered ? '답변완료' : '대기'}">대기</span>
                </li>
            </ul>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
