<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="narrow">
    <section class="panel">
        <p class="eyebrow">Member Login</p>
        <h1>로그인</h1>
        <div class="flash success" th:if="${message}" th:text="${message}"></div>
        <div class="flash error" th:if="${param.error}">아이디 또는 비밀번호를 확인해 주세요.</div>
        <form th:action="@{/login}" method="post" class="stack-form">
            <input name="username" placeholder="아이디" required>
            <input name="password" type="password" placeholder="비밀번호" required>
            <button class="button" type="submit">로그인</button>
        </form>
        <p class="muted">테스트 계정: admin / admin1234, user / user1234</p>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
