<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
    <section class="page-title">
        <p class="eyebrow">Admin</p>
        <h1>관리자 대시보드</h1>
    </section>
    <div class="flash success" th:if="${message}" th:text="${message}"></div>
    <section class="content-band admin-grid">
        <div class="panel">
            <h2>시술 상품 일괄 등록 (XML)</h2>
            <form th:action="@{/admin/procedures/import}" method="post" enctype="multipart/form-data" class="stack-form">
                <input name="file" type="file" accept=".xml" required>
                <button class="button" type="submit">XML 등록</button>
            </form>
        </div>
        <div class="panel admin-procedure-panel">
            <h2>시술/상담 패키지 관리</h2>
            <ul class="mini-list admin-procedure-list" th:if="${!#lists.isEmpty(procedures)}">
                <li th:each="procedure : ${procedures}">
                    <div>
                        <strong th:text="${procedure.name}">패키지명</strong>
                        <span th:text="|${procedure.category} · ${#numbers.formatInteger(procedure.price, 0, 'COMMA')}원|">카테고리 · 가격</span>
                    </div>
                    <form th:action="@{/admin/procedures/{id}/delete(id=${procedure.id})}" method="post" onsubmit="return confirm('이 패키지를 삭제하시겠습니까? 기존 결제내역은 유지됩니다.');">
                        <button class="button button-danger button-small" type="submit">삭제</button>
                    </form>
                </li>
            </ul>
            <p class="muted" th:if="${#lists.isEmpty(procedures)}">등록된 시술/상담 패키지가 없습니다.</p>
        </div>
        <div class="panel">
            <h2>최근 상담 신청</h2>
            <ul class="mini-list">
                <li th:each="item : ${consultations}">
                    <strong th:text="${item.name}">이름</strong>
                    <span th:text="|${item.phone} · ${item.area} · ${item.preferredContact}|">상담</span>
                </li>
            </ul>
        </div>
        <div class="panel">
            <h2>최근 결제</h2>
            <ul class="mini-list">
                <li th:each="order : ${orders}">
                    <strong th:text="${order.orderNumber}">주문번호</strong>
                    <span th:text="|${order.buyer.name} · ${order.procedureProduct.name} · ${#numbers.formatInteger(order.amount, 0, 'COMMA')}원 · ${order.pointsUsed}P 사용|">결제</span>
                </li>
            </ul>
        </div>
        <div class="panel">
            <h2>Q&A 답변 관리</h2>
            <ul class="mini-list">
                <li th:each="post : ${qnas}">
                    <a th:href="@{/qna/{id}(id=${post.id})}" th:text="${post.title}">상담</a>
                    <span th:text="${post.answered ? '답변완료' : '대기'}">대기</span>
                </li>
            </ul>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
