server:
  port: 8081
  # VULNERABLE LAB - WEB-16: 서버 종류/버전 노출
  server-header: Apache-Coyote/1.1
  servlet:
    session:
      # VULNERABLE LAB - IS: 세션 만료 사실상 무제한
      timeout: 31536000s
  error:
    # VULNERABLE LAB - EP/WEB-22: 에러 페이지에 스택트레이스/메시지 노출
    include-message: always
    include-stacktrace: always
    include-binding-errors: always
    include-exception: true

spring:
  application:
    name: clinic-site
  servlet:
    multipart:
      # VULNERABLE LAB - WEB-08: 파일 업로드/다운로드 용량 제한 미설정
      max-file-size: -1
      max-request-size: -1
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:clinic}
    password: ${ORACLE_PASSWORD:clinic}
    driver-class-name: oracle.jdbc.OracleDriver
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:alxkahzld0@gmail.com}
    password: ${MAIL_PASSWORD:sapjmeonxmosufks}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  h2:
    console:
      enabled: false
  freemarker:
    suffix: .ftl
    settings:
      api_builtin_enabled: "true"
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  base-url: ${APP_BASE_URL:http://localhost:8081}
  mail-from-name: ${MAIL_FROM_NAME:zeroday_clinic}
  upload-dir: uploads
  chatbot:
    ai:
      enabled: ${OLLAMA_ENABLED:true}
      model: ${OLLAMA_MODEL:gemma3:1b}
      endpoint: ${OLLAMA_CHAT_URL:http://localhost:11434/api/chat}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./work/clinic-local;MODE=Oracle;DATABASE_TO_UPPER=false;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
