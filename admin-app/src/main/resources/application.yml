server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: clinic-admin-app
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:clinic}
    password: ${ORACLE_PASSWORD:clinic}
    driver-class-name: oracle.jdbc.OracleDriver
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  h2:
    console:
      enabled: false
  freemarker:
    suffix: .ftl
    settings:
      api_builtin_enabled: "true"
      # ?url 빌트인은 출력 인코딩이 지정되어 있지 않으면 예외를 던진다.
      # (회원 검색 결과의 ?keyword=... 링크, 의무기록 다운로드 링크에서 사용)
      output_encoding: UTF-8
      url_escaping_charset: UTF-8
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  base-url: ${APP_BASE_URL:http://localhost:8081}
  admin-login-secret: ${ADMIN_LOGIN_SECRET:clinic-admin-login}
  mail-from-name: ${MAIL_FROM_NAME:zeroday_clinic}
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  chatbot:
    ai:
      enabled: ${OLLAMA_ENABLED:true}
      model: ${OLLAMA_MODEL:gemma3:1b}
      endpoint: ${OLLAMA_CHAT_URL:http://localhost:11434/api/chat}

---
# 로컬에서는 고객 앱(8081)과 함께 띄울 수 있도록 8082를 쓴다. (운영은 WAS가 분리되어 8081 유지)
server:
  port: ${SERVER_PORT:8082}

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./work/clinic-local;MODE=Oracle;DATABASE_TO_UPPER=false;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
